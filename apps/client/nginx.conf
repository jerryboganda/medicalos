# medicalos-web: static SPA + same-origin /api/ proxy to the API container.
# The client is baked with VITE_API_BASE=/api so all calls go to /api/v1/... on
# this same origin; nginx forwards /api/* (stripped) to medicalos-api:8080.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/security-headers.conf;

    # API + provenance live behind the same origin (no CORS).
    # nginx strips /api/ so the container keeps its existing routes.
    # LTI form_post is a browser navigation that must render in an HTTPS LMS frame.
    location = /api/v1/lti/launch {
        include /etc/nginx/conf.d/lti-embed-headers.conf;
        proxy_pass http://medicalos-api:8080/v1/lti/launch;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://medicalos-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The UI routes reached after a valid launch share the LTI-only frame policy.
    location ^~ /lti/ {
        include /etc/nginx/conf.d/lti-embed-headers.conf;
        # Serve the SPA in this location so its LTI frame policy survives.
        try_files $uri $uri/ /index.html =404;
    }

    # version.json doubles as the deploy-provenance endpoint: the static
    # build stamps it (client static/), so serve the file — never the API
    # (whose /version.json lives at a different path).
    location = /api/version.json {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 0;
        add_header Cache-Control "no-store";
        try_files /version.json =404;
    }

    # SPA: static assets cache hard, deep links fall back to index.
    location /_app/ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /version.json {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 0;
        add_header Cache-Control "no-store";
        try_files /version.json =404;
    }
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
