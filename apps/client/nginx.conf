# medicalos-web: static SPA + same-origin /api/ proxy to the API container.
# The client is baked with VITE_API_BASE='' so all calls go to /v1/... on
# this same origin; nginx forwards /api/* (stripped) to medicalos-api:8080.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API + provenance live behind the same origin (no CORS).
    # nginx strips /api/ so the container keeps its existing routes.
    location /api/ {
        proxy_pass http://medicalos-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # version.json doubles as the deploy-provenance endpoint.
    location = /api/version.json {
        expires 0;
        add_header Cache-Control "no-store";
        proxy_pass http://medicalos-api:8080/version.json;
        proxy_set_header Host $host;
    }

    # SPA: static assets cache hard, deep links fall back to index.
    location /_app/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /version.json {
        expires 0;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
