# LTI launch and picker responses may be embedded by secure campus LMS hosts.
# This exception is limited to /api/v1/lti/launch and /lti/* in nginx.conf;
# every other app route keeps the shared X-Frame-Options: DENY policy.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors https:; base-uri 'self'; form-action 'self' https:" always;
add_header Content-Security-Policy "frame-ancestors https:;" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=15552000" always;
add_header Cache-Control "no-store" always;
