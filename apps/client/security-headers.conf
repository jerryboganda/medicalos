# Security headers shared by every response, including the locations that
# define their own Cache-Control add_header (nginx add_header inheritance
# stops at any location that declares its own). Included from default.conf.
# CSP ships report-only first: SvelteKit inlines hydration data as a script,
# so a policy will need hashes before it can be enforced — violations show
# in browser consoles without breaking the app.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Owner-approved 2026-09-30. Six months, no includeSubDomains and no
# preload: conservative by design. Raise the max-age only after a full TLS
# renewal cycle has succeeded under this header (runbook §deployment).
add_header Strict-Transport-Security "max-age=15552000" always;
