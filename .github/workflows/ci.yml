# CI per master plan §27/§27.1 and the project compute policy (AGENTS.md):
# ALL builds, lints, tests, screenshots, and artifacts run here — never on the
# production VPS or local development machines. Gates for later-phase surfaces
# (contract-drift check, desktop/mobile build + signing, performance budgets)
# are added in the phase that first has code for them (issue 04).

name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # Linux runner: API, workers, crates, WASM (§27.1)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/medos_ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      # Rust compile caching is mandatory under the compute rule (§27.1)
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      # Compile-time-checked queries (§31.1) expand against the live schema.
      # OPS-03: Verify all migrations apply, roll back in reverse order, and reapply cleanly (§30.1)
      - name: Verify migration rollback and reapply
        run: bash scripts/verify-migrations.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Dependency advisories + licenses
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: Tests
        run: cargo test --workspace -- --test-threads=1
      # ARCH-02: Rust DTOs own generated client contracts. Keep the first
      # export bootstrap green, then reject any stale checked-in declarations.
      - name: Export Rust-owned TypeScript contracts
        env:
          TS_RS_EXPORT_DIR: ${{ github.workspace }}/apps/client/src/lib/generated
        run: cargo test -p api --lib --features type-export -- --test-threads=1
      - name: Check generated TypeScript contracts are current
        shell: bash
        env:
          ARCH02_BOOTSTRAP_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          # A marked codex push may upload newly generated declarations once.
          # The PR check stays strict, and the follow-up commit must pass here.
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/heads/codex/* && "$ARCH02_BOOTSTRAP_COMMIT_MESSAGE" == *"[arch02-bootstrap]"* ]]; then
            echo "::notice::ARCH-02 bootstrap artifact run; pull-request drift enforcement remains active."
          elif [ -n "$(git ls-files apps/client/src/lib/generated)" ]; then
            git diff --exit-code -- apps/client/src/lib/generated
            test -z "$(git ls-files --others --exclude-standard -- apps/client/src/lib/generated)"
          else
            echo "::notice::ARCH-02 bindings are being bootstrapped from Rust DTOs."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: arch02-typescript-bindings
          path: apps/client/src/lib/generated
          include-hidden-files: true
      # Offline query cache: committed to the repo so Docker/release builds
      # compile the same checked queries without a live database.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --locked --no-default-features --features rustls,postgres
      - name: Generate offline query cache
        run: cargo sqlx prepare --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: sqlx-offline-cache
          path: .sqlx
          include-hidden-files: true
      # ARCH-01: shared core compiles for the web build and runs with the same
      # observable results in a wasm runtime (parity vectors + node execution)
      - name: Shared core builds for wasm32
        run: |
          cargo build -p domain-contracts -p calc-engine -p competition-scoring -p scheduler --target wasm32-unknown-unknown
          cargo build -p calc-engine --target wasm32-unknown-unknown --features parity --release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wasm runtime parity check
        run: node scripts/wasm-parity.mjs

  client:
    # SvelteKit SPA shared by web/PWA and Tauri shells (ADR 0003)
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: arch02-typescript-bindings
          path: apps/client/src/lib/generated
      - name: Install workspace dependencies
        run: npm install
      - name: Build client
        run: npm run build -w @medical-os/client
      - name: TRUST-01 audit
        run: node scripts/trust01-audit.mjs

  site:
    # Astro marketing site — holds no learner data (§31.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install
      - name: Build site
        run: npm run build -w @medical-os/site

  e2e:
    # Browser end-to-end of the web build against the real API (§27.1)
    needs: rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/medos_ci
      VITE_API_BASE: http://127.0.0.1:8080
      MIN_TIME_LIMIT_SECONDS: "5"
      # E2E-only token for creating policy-specific mock fixtures.
      ADMIN_TOKEN: e2e-only-admin-token
      # CI-only fixture for offline-pack manifest signing; production uses the
      # VPS_PACK_SIGNING_KEY secret (docs/deployment/production.md).
      PACK_SIGNING_KEY: ci-only-pack-signing-key-0123456789abcdef
      # Community statistics (and share cards) unlock at this sample size in
      # browser tests; production keeps the 20-attempt default.
      COMMUNITY_MIN_SAMPLE: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: arch02-typescript-bindings
          path: apps/client/src/lib/generated
      - name: Apply schema (compile-time query checks need the live schema)
        run: |
          for f in apps/api/migrations/*.up.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f" || exit 1
          done
      - name: Build API
        run: cargo build -p api
      - name: Seed synthetic fixtures
        run: cargo run -p api -- --seed
      - name: Start API
        run: |
          ./target/debug/api > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/healthz
      - name: Install workspace dependencies
        run: npm install
      - name: Build client
        run: npm run build -w @medical-os/client
      - name: Build site
        run: npm run build -w @medical-os/site
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Run browser E2E
        run: npx playwright test
        working-directory: tests/e2e
      - name: API logs on failure
        if: failure()
        run: cat api.log
      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: tests/e2e/test-results
          include-hidden-files: true
          if-no-files-found: ignore
