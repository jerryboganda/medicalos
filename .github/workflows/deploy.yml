# Production deployment — medicalos.polytronx.com on the shared VPS.
# Builds run entirely in GitHub Actions (AGENTS.md compute policy); the VPS
# serves only the live app — it pulls the GHCR images, it never builds.
# Sequence per owner mandate: repo PUBLIC during deploy+verify, then PRIVATE.

name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.scratch/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/jerryboganda
  DOMAIN: medicalos.polytronx.com

jobs:
  api-image:
    # Production API container → GHCR. The VPS runbook is one docker run
    # (infra/vps/deploy.sh, via the deploy-vps job below).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/medicalos-api:latest
            ${{ env.REGISTRY }}/medicalos-api:${{ github.sha }}

  web-image:
    # Static client SPA + same-origin /api/ proxy → GHCR. The client is
    # baked with VITE_API_BASE='' (same origin reaches the API container
    # through the /api/ prefix, so no CORS configuration is needed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Stamp deployment provenance
        run: |
          # Served at /version.json (no-store) so production E2E can prove
          # the exact commit landed. SvelteKit serves static/ as its public
          # dir — create it first (fresh runners have no static/ dir).
          mkdir -p apps/client/static
          printf '{"sha":"%s","repo":"%s","deployed_at":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$(date -u +%FT%TZ)" \
            > apps/client/static/version.json
      - name: Build client (same-origin API via /api/)
        run: npm run build -w @medical-os/client
        env:
          VITE_API_BASE: ''
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/client
          push: true
          tags: |
            ${{ env.REGISTRY }}/medicalos-web:latest
            ${{ env.REGISTRY }}/medicalos-web:${{ github.sha }}

  api-release:
    # Static Linux binary as a release artifact (VPS without Docker).
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p api
      - uses: actions/upload-artifact@v4
        with:
          name: medicalos-api-linux-x86_64
          path: target/release/api

  deploy-vps:
    # Ship to the shared VPS over SSH: pull GHCR images, recreate the two
    # containers, health-check. Lightweight by design (AGENTS.md compute
    # policy) — all compiling happened in the jobs above.
    # Secrets are repo-level (owner decision: no environment gate yet).
    needs: [api-image, web-image]
    runs-on: ubuntu-latest
    concurrency:
      group: medicalos-vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            export DATABASE_URL='${{ secrets.VPS_DATABASE_URL }}'
            export REGISTRY='${{ env.REGISTRY }}'
            bash -s '${{ github.sha }}' < infra/vps/deploy.sh

  production-verify:
    # Mandated production E2E: the live domain must serve the app AND prove
    # the latest commit landed (version.json carries the deployed SHA).
    needs: deploy-vps
    runs-on: ubuntu-latest
    steps:
      - name: Verify production serves this exact commit
        run: |
          set -e
          BASE="https://${{ env.DOMAIN }}"
          echo "Checking $BASE ..."
          ok=""
          for i in $(seq 1 10); do
            if curl -sf "$BASE/api/version.json" | grep -q "\"sha\":\"${GITHUB_SHA}\"" \
               && curl -sf "$BASE/" | grep -q 'data-sveltekit-preload-data'; then
              ASSET=$(curl -sf "$BASE/" | grep -o '/_app/immutable/entry/start[^"]*\.js' | head -1)
              if [ -n "$ASSET" ] && curl -sf "$BASE$ASSET" > /dev/null \
                 && curl -sf "$BASE/api/healthz" | grep -q ok; then
                ok=yes
                break
              fi
            fi
            echo "attempt $i: production not converged yet; retrying..."
            sleep 20
          done
          [ "$ok" = "yes" ] || { echo "FAIL: production never verified"; exit 1; }
          echo "PRODUCTION VERIFIED: commit ${GITHUB_SHA} is live on $BASE."
