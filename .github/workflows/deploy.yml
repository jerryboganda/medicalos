# Production deployment (mandated sequence: PUBLIC repo → deploy → verify → PRIVATE).
# Builds run entirely in GitHub Actions (AGENTS.md compute policy); the VPS
# serves only the live app — it pulls the GHCR image, it never builds.

name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  api-image:
    # Production API container → GHCR. The VPS runbook is one docker run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jerryboganda/medicalos-api:latest
            ghcr.io/jerryboganda/medicalos-api:${{ github.sha }}

  api-release:
    # Static Linux binary as a release artifact (VPS without Docker).
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p api
      - uses: actions/upload-artifact@v4
        with:
          name: medicalos-api-linux-x86_64
          path: target/release/api

  web-pages:
    # Client SPA → GitHub Pages, stamped with the commit SHA so production
    # E2E can verify the latest commit actually landed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Stamp deployment provenance
        run: |
          # SvelteKit serves static assets from `static/` (its vite publicDir).
          mkdir -p apps/client/static
          printf '{"sha":"%s","repo":"%s","deployed_at":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$(date -u +%FT%TZ)" \
            > apps/client/static/version.json
      - name: Build client for Pages
        run: npm run build -w @medical-os/client
        env:
          BASE_PATH: /medicalos
      - name: SPA fallback for deep links
        run: cp apps/client/build/index.html apps/client/build/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/client/build

  deploy-pages:
    needs: web-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  production-verify:
    # Mandated production E2E: the live site must serve the app AND prove the
    # latest commit landed (version.json carries the deployed SHA).
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - name: Verify production serves this exact commit
        run: |
          set -e
          BASE="https://jerryboganda.github.io/medicalos"
          echo "Checking $BASE ..."
          # Pages CDN may serve a stale copy for up to 10 minutes — retry.
          for i in $(seq 1 18); do
            if curl -sf "$BASE/version.json" | grep -q "\"sha\":\"${GITHUB_SHA}\""; then
              echo "SHA match: latest commit is live."
              break
            fi
            echo "attempt $i: CDN still stale; retrying..."
            sleep 30
            [ "$i" -eq 18 ] && { echo "FAIL: deployed SHA never matched"; exit 1; }
          done
          # SPA: the shell must mount the SvelteKit app (content renders via JS).
          curl -sf "$BASE/" | grep -q 'data-sveltekit-preload-data' \
            || { echo "FAIL: app shell not served"; exit 1; }
          # App assets must load (JS entry bundle reachable).
          ASSET=$(curl -sf "$BASE/" | grep -o '/medicalos/_app/immutable/entry/start[^"]*\.js' | head -1)
          [ -n "$ASSET" ] || { echo "FAIL: no entry bundle referenced"; exit 1; }
          curl -sf "$BASE$ASSET" > /dev/null || { echo "FAIL: entry bundle 404"; exit 1; }
          echo "PRODUCTION VERIFIED: commit ${GITHUB_SHA} is live and serving."
