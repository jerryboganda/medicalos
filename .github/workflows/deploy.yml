# Exact-CI-gated images and release artifacts for the authorized Orca stack.
# Builds run entirely in GitHub Actions (AGENTS.md compute policy).
# Legacy remote jobs remain disabled unless the owner explicitly selects that
# runtime through MEDICALOS_RUNTIME_TARGET; this task does not operate the VPS.

name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.scratch/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write
  # OPS-03: keyless image signing — cosign signs with an OIDC-derived
  # certificate (no stored key); verification happens in production-verify.
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/jerryboganda
  DOMAIN: medicalos.polytronx.com

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const requireSuccessfulCi = require('./scripts/release-ci-gate.cjs');
            await requireSuccessfulCi({github, context, core});

  sqlx-cache:
    needs: ci-gate
    # The committed .sqlx query cache goes stale as checked queries evolve;
    # SQLX_OFFLINE builds (docker image + release binary) fail on any query
    # missing from it. Regenerate from the live schema here so every offline
    # build in this workflow compiles the exact current queries — same
    # compile-time checks ci.yml runs, no database needed downstream.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medos_deploy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/medos_deploy
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --locked --no-default-features --features rustls,postgres
      - name: Apply schema
        run: |
          for f in apps/api/migrations/*.up.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f" || exit 1
          done
      - name: Generate offline query cache
        run: cargo sqlx prepare --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: sqlx-offline-cache
          path: .sqlx
          include-hidden-files: true

  api-image:
    # Production API container → GHCR. The VPS runbook is one docker run
    # (infra/vps/deploy.sh, via the deploy-vps job below).
    needs: sqlx-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh offline query cache
        uses: actions/download-artifact@v4
        with:
          name: sqlx-offline-cache
          path: .sqlx
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export GHCR pull credentials for the VPS
        run: |
          echo "GHCR_USER=${{ github.actor }}" >> "$GITHUB_ENV"
          echo "GHCR_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_ENV"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/medicalos-api:latest
            ${{ env.REGISTRY }}/medicalos-api:${{ github.sha }}
      # OPS-03: keyless-sign the pushed digest — the signature lives in the
      # registry and Rekor; production-verify refuses unsigned images.
      - uses: sigstore/cosign-installer@v3
      - name: Sign the API image (keyless)
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/medicalos-api@${{ steps.push.outputs.digest }}"

  web-image:
    needs: ci-gate
    # Static client SPA + same-origin /api/ proxy → GHCR. The client is
    # baked with VITE_API_BASE=/api (same origin reaches the API container
    # through the /api/ prefix, so no CORS configuration is needed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Stamp deployment provenance
        run: |
          # Served at /version.json (no-store) so production E2E can prove
          # the exact commit landed. SvelteKit serves static/ as its public
          # dir — create it first (fresh runners have no static/ dir).
          mkdir -p apps/client/static
          printf '{"sha":"%s","repo":"%s","deployed_at":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$(date -u +%FT%TZ)" \
            > apps/client/static/version.json
      - name: Build client (same-origin API via /api/)
        run: npm run build -w @medical-os/client
        env:
          VITE_API_BASE: /api
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: apps/client
          push: true
          tags: |
            ${{ env.REGISTRY }}/medicalos-web:latest
            ${{ env.REGISTRY }}/medicalos-web:${{ github.sha }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign the web image (keyless)
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/medicalos-web@${{ steps.push.outputs.digest }}"

  site-image:
    needs: ci-gate
    # Static Astro marketing site → GHCR (ADR 0002: prod origin is an open
    # owner decision; today's consumer is the local Orca staging stack).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build -w @medical-os/site
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/site
          push: true
          tags: |
            ${{ env.REGISTRY }}/medicalos-site:latest
            ${{ env.REGISTRY }}/medicalos-site:${{ github.sha }}

  api-release:
    # Static Linux binary as a release artifact (VPS without Docker).
    needs: sqlx-cache
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Refresh offline query cache
        uses: actions/download-artifact@v4
        with:
          name: sqlx-offline-cache
          path: .sqlx
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p api
      - uses: actions/upload-artifact@v4
        with:
          name: medicalos-api-linux-x86_64
          path: target/release/api

  deploy-vps:
    # The authorized target is Orca; legacy remote operations need an
    # explicit runtime selection outside this task.
    if: vars.MEDICALOS_RUNTIME_TARGET == 'vps'
    # Ship to the shared VPS over SSH: pull GHCR images, recreate the two
    # containers, health-check. Lightweight by design (AGENTS.md compute
    # policy) — all compiling happened in the jobs above.
    # Secrets are repo-level (owner decision: no environment gate yet).
    needs: [api-image, web-image]
    runs-on: ubuntu-latest
    concurrency:
      group: medicalos-vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production VPS
        uses: appleboy/ssh-action@v1
        env:
          OIDC_CREDENTIAL_KEY: ${{ secrets.VPS_OIDC_CREDENTIAL_KEY }}
          PACK_SIGNING_KEY: ${{ secrets.VPS_PACK_SIGNING_KEY }}
          ZITADEL_ISSUER: ${{ secrets.VPS_ZITADEL_ISSUER }}
          ZITADEL_CLIENT_ID: ${{ secrets.VPS_ZITADEL_CLIENT_ID }}
          ZITADEL_CLIENT_SECRET: ${{ secrets.VPS_ZITADEL_CLIENT_SECRET }}
          ZITADEL_PROJECT_ID: ${{ secrets.VPS_ZITADEL_PROJECT_ID }}
          ZITADEL_IDP_GOOGLE: ${{ secrets.VPS_ZITADEL_IDP_GOOGLE }}
          ZITADEL_IDP_APPLE: ${{ secrets.VPS_ZITADEL_IDP_APPLE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: OIDC_CREDENTIAL_KEY,PACK_SIGNING_KEY,ZITADEL_ISSUER,ZITADEL_CLIENT_ID,ZITADEL_CLIENT_SECRET,ZITADEL_PROJECT_ID,ZITADEL_IDP_GOOGLE,ZITADEL_IDP_APPLE
          # Inline the script (script_file + script_arguments silently sent
          # NOTHING in v1: the debug log showed empty CMD with success).
          # The script content is identical to infra/vps/deploy.sh — keep
          # both in sync; the file remains the VPS-side source of truth.
          script: |
            set -euo pipefail
            SHA='${{ github.sha }}'
            export VPS_DATABASE_URL_AS_ARG='${{ secrets.VPS_DATABASE_URL }}'
            DATABASE_URL="$VPS_DATABASE_URL_AS_ARG"
            REGISTRY='ghcr.io/jerryboganda'
            PUBLIC_API_BASE_URL='https://medicalos.polytronx.com/api'
            PUBLIC_APP_URL='https://medicalos.polytronx.com'
            # Platform sign-in (Zitadel). All-or-nothing: the API silently
            # disables platform sign-in when any of the trio is missing, so
            # a partial secret set must fail the deploy instead.
            if [ -n "${ZITADEL_ISSUER}${ZITADEL_CLIENT_ID}${ZITADEL_CLIENT_SECRET}" ]; then
              for v in ZITADEL_ISSUER ZITADEL_CLIENT_ID ZITADEL_CLIENT_SECRET; do
                [ -n "${!v}" ] || { echo "$v is empty: ZITADEL_ISSUER, ZITADEL_CLIENT_ID and ZITADEL_CLIENT_SECRET are required together" >&2; exit 1; }
              done
            fi
            if [ "${#PACK_SIGNING_KEY}" -lt 32 ] || [ -z "${PACK_SIGNING_KEY//[[:space:]]/}" ]; then
              echo "VPS_PACK_SIGNING_KEY must contain at least 32 non-whitespace bytes" >&2
              exit 1
            fi
            API_IMAGE="$REGISTRY/medicalos-api:$SHA"
            WEB_IMAGE="$REGISTRY/medicalos-web:$SHA"
            echo "[medicalos] pulling $API_IMAGE $WEB_IMAGE"
            # Fresh GHCR login per deploy: the package may be private or the
            # VPS's stored credential stale — the job token is valid now.
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker pull "$API_IMAGE"
            docker pull "$WEB_IMAGE"
            echo "[medicalos] pulled:"
            docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
              | grep -E "medicalos-(api|web):$SHA" || {
              echo "pulled images do not include SHA $SHA" >&2
              exit 1
            }
            # OPS-03: verify the keyless signatures ON the VPS before
            # anything is recreated — an unsigned or re-tagged image aborts
            # the deploy with the current containers still serving.
            COSIGN_VERSION="${COSIGN_VERSION:-2.4.1}"
            if ! command -v cosign >/dev/null 2>&1; then
              echo "[medicalos] installing cosign v$COSIGN_VERSION"
              curl -sfL "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
                -o /usr/local/bin/cosign
              chmod +x /usr/local/bin/cosign
            fi
            COSIGN_ID_REGEXP='^https://github.com/jerryboganda/medicalos/\.github/workflows/deploy\.yml@refs/heads/main$'
            for image in "$API_IMAGE" "$WEB_IMAGE"; do
              cosign verify "$image" \
                --certificate-identity-regexp "$COSIGN_ID_REGEXP" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                >/dev/null \
                || { echo "signature verification failed for $image — aborting before any container is touched" >&2; exit 1; }
              echo "[medicalos] signature verified: $image"
            done
            echo "[medicalos] recreating medicalos-api (image: $API_IMAGE)"
            docker rm -f medicalos-api 2>/dev/null || true
            docker run -d --name medicalos-api --restart unless-stopped \
              --cpus "1.0" --memory "1g" \
              --network platform \
              -e DATABASE_URL="$DATABASE_URL" \
              -e PUBLIC_API_BASE_URL="$PUBLIC_API_BASE_URL" \
              -e PUBLIC_APP_URL="$PUBLIC_APP_URL" \
              -e OIDC_CREDENTIAL_KEY="${OIDC_CREDENTIAL_KEY:-}" \
              -e PACK_SIGNING_KEY="$PACK_SIGNING_KEY" \
              -e ZITADEL_ISSUER="${ZITADEL_ISSUER:-}" \
              -e ZITADEL_CLIENT_ID="${ZITADEL_CLIENT_ID:-}" \
              -e ZITADEL_CLIENT_SECRET="${ZITADEL_CLIENT_SECRET:-}" \
              -e ZITADEL_PROJECT_ID="${ZITADEL_PROJECT_ID:-}" \
              -e ZITADEL_IDP_GOOGLE="${ZITADEL_IDP_GOOGLE:-}" \
              -e ZITADEL_IDP_APPLE="${ZITADEL_IDP_APPLE:-}" \
              -e MIN_TIME_LIMIT_SECONDS=30 \
              -e FREE_DAILY_QUESTIONS=10 \
              "$API_IMAGE"
            echo "[medicalos] api container: $(docker inspect medicalos-api --format '{{.Config.Image}}')"
            echo "[medicalos] recreating medicalos-web (image: $WEB_IMAGE)"
            docker rm -f medicalos-web 2>/dev/null || true
            docker run -d --name medicalos-web --restart unless-stopped \
              --cpus "0.5" --memory "256m" \
              --network platform \
              "$WEB_IMAGE"
            docker network connect nginx-proxy-manager_default medicalos-web 2>/dev/null || true
            echo "[medicalos] web container: $(docker inspect medicalos-web --format '{{.Config.Image}}')"
            echo "[medicalos] health-check (API + web through the container network)"
            # Migrations 0050-0059 (incl. RLS + backfills) can push API
            # startup past 60s under load — allow 90 iterations x 2s.
            for i in $(seq 1 90); do
              if docker run --rm --network platform curlimages/curl:8.5.0 -sf http://medicalos-api:8080/healthz 2>/dev/null | grep -q ok \
                && docker run --rm --network platform curlimages/curl:8.5.0 -sf "http://medicalos-web/" 2>/dev/null | grep -q 'data-sveltekit-preload-data'; then
                echo "[medicalos] api + web healthy"
                break
              fi
              [ "$i" -eq 90 ] && { echo "stack never became healthy" >&2; exit 1; }
              sleep 2
            done
            echo "[medicalos] live on medicalos.polytronx.com @ $SHA"

  production-verify:
    # Mandated production E2E: the live domain must serve the app AND prove
    # the latest commit landed (version.json carries the deployed SHA).
    needs: deploy-vps
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: Verify the deployed images are the signed ones (OPS-03)
        run: |
          set -e
          ID_REGEXP='^https://github.com/jerryboganda/medicalos/\.github/workflows/deploy\.yml@refs/heads/main$'
          for image in medicalos-api medicalos-web; do
            cosign verify \
              "${{ env.REGISTRY }}/$image:${{ github.sha }}" \
              --certificate-identity-regexp "$ID_REGEXP" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              > /dev/null
            echo "[medicalos] $image:${{ github.sha }} signature verified"
          done
      - name: Verify production serves this exact commit
        run: |
          set -e
          BASE="https://${{ env.DOMAIN }}"
          echo "Checking $BASE ..."
          ok=""
          for i in $(seq 1 10); do
            if curl -sf "$BASE/api/version.json" | grep -q "\"sha\":\"${GITHUB_SHA}\"" \
               && curl -sf "$BASE/" | grep -q 'data-sveltekit-preload-data'; then
              ASSET=$(curl -sf "$BASE/" | grep -o '/_app/immutable/entry/start[^"]*\.js' | head -1)
              if [ -n "$ASSET" ] && curl -sf "$BASE$ASSET" > /dev/null \
                 && curl -sf "$BASE/api/healthz" | grep -q ok; then
                ok=yes
                break
              fi
            fi
            echo "attempt $i: production not converged yet; retrying..."
            sleep 20
          done
          [ "$ok" = "yes" ] || { echo "FAIL: production never verified"; exit 1; }
          echo "PRODUCTION VERIFIED: commit ${GITHUB_SHA} is live on $BASE."
