# Local staging stack for Orca Desktop (docs/deployment/orca-desktop.md).
# Mirrors the VPS topology at reduced size; every image is prebuilt by
# .github/workflows/deploy.yml — nothing compiles on this machine
# (AGENTS.md compute policy). All host ports are loopback-only and the web
# nginx.conf expects the API service to be named exactly `medicalos-api`.
# Compose's default per-project network provides service-name DNS.
name: medicalos-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: medicalos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/local/.env}
      POSTGRES_DB: medicalos
    # Tuned for one local staging app, not the shared platform instance.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    volumes:
      - medos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicalos -d medicalos"]
      interval: 5s
      timeout: 3s
      retries: 12
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped

  medicalos-api:
    # Applies apps/api/migrations on first boot (api::schema::apply_up).
    image: ghcr.io/jerryboganda/medicalos-api:${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://medicalos:${POSTGRES_PASSWORD}@postgres:5432/medicalos
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8081/api}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8081}
      PACK_SIGNING_KEY: ${PACK_SIGNING_KEY:?set PACK_SIGNING_KEY (>=32 bytes) in infra/local/.env}
      MIN_TIME_LIMIT_SECONDS: "30"
      FREE_DAILY_QUESTIONS: "10"
      # Local admin-console token (x-admin-token header; client stores it in
      # localStorage['mlos_admin']). Roles + MFA also grant named permissions.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Platform sign-in through the local Zitadel (infra/zitadel/provision.sh
      # prints these). Unset = password login + institution SSO only.
      ZITADEL_ISSUER: ${ZITADEL_ISSUER:-}
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID:-}
      ZITADEL_CLIENT_SECRET: ${ZITADEL_CLIENT_SECRET:-}
      ZITADEL_PROJECT_ID: ${ZITADEL_PROJECT_ID:-}
    ports:
      # Host side 18080: in the shared engine distro, 8080 belongs to
      # another project (Freebuff2API). Container-internal stays 8080.
      - "127.0.0.1:18080:8080"
    # Readiness checks the database; liveness remains available separately.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"ok\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped

  medicalos-web:
    image: ghcr.io/jerryboganda/medicalos-web:${IMAGE_TAG:-latest}
    depends_on:
      medicalos-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
    cpus: 0.25
    mem_limit: 128m
    restart: unless-stopped

  # Marketing site (ADR 0002). Its GHCR image is new (deploy.yml site-image
  # job) — until it exists, deploy the core stack without this profile.
  medicalos-site:
    profiles: ["full"]
    image: ghcr.io/jerryboganda/medicalos-site:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8082:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
    cpus: 0.1
    mem_limit: 64m
    restart: unless-stopped

  # Identity provider (.scratch/auth-zitadel/spec.md). Same shape as the VPS:
  # its own database on the stack's Postgres, built-in (v1) login so there is
  # no extra Next.js container. The browser (Windows resolves *.localhost to
  # loopback) and the API container (network alias below) reach it at the
  # same issuer URL: http://auth.medicalos.localhost:8083.
  zitadel-db:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint:
      - sh
      - -c
      - >-
        psql -h postgres -U medicalos -d medicalos -tAc
        "SELECT 1 FROM pg_database WHERE datname = 'zitadel'" | grep -q 1
        || psql -h postgres -U medicalos -d medicalos -c 'CREATE DATABASE zitadel'
    restart: "no"

  zitadel:
    # Pinned: v4 keeps the built-in login behind LOGINV2_REQUIRED=false;
    # v6 removes it — revisit before upgrading past v5.
    image: ghcr.io/zitadel/zitadel:v4.16.0
    user: "0"
    command: start-from-init --masterkeyFromEnv --tlsMode disabled
    depends_on:
      zitadel-db:
        condition: service_completed_successfully
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?set a 32-character ZITADEL_MASTERKEY in infra/local/.env}
      ZITADEL_PORT: "8083"
      ZITADEL_EXTERNALDOMAIN: auth.medicalos.localhost
      ZITADEL_EXTERNALPORT: "8083"
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://medicalos:${POSTGRES_PASSWORD}@postgres:5432/zitadel?sslmode=disable
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      # Phase 2 imports existing argon2id password hashes.
      ZITADEL_SYSTEMDEFAULTS_PASSWORDHASHER_VERIFIERS: argon2
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Medical OS
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: owner
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?set ZITADEL_ADMIN_PASSWORD in infra/local/.env}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: provisioner
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Provisioner
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/provisioner.pat
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap
    ports:
      - "127.0.0.1:8083:8083"
    networks:
      default:
        aliases:
          - auth.medicalos.localhost
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 30s
    cpus: 0.5
    mem_limit: 768m
    restart: unless-stopped

volumes:
  medos-pgdata:
  zitadel-bootstrap:
