# cargo-deny policy: advisories (RustSec) use defaults; licenses must be
# permissive or the project's own proprietary marker. Private project — the
# final license choice is an owner decision (issue 12, brand/entity).

[licenses]
allow = [
    "LicenseRef-Proprietary",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
