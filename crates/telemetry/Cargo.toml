[package]
name = "telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["otlp"]
# OTLP export pulls the OpenTelemetry stack; the runtime gate is the
# OTEL_EXPORTER_OTLP_ENDPOINT env — without it nothing is initialized.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", optional = true, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", optional = true, features = ["http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.28", optional = true }
